name: Contributor agreement

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  cla-acceptance:
    name: CLA acceptance
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify CLA checkbox
        shell: bash
        run: |
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          required='- [x] I have read and agree to the Contributor License Agreement (CLA.md).'
          if ! grep -Fq -- "$required" <<<"$body"; then
            echo "The Contributor License Agreement checkbox is required."
            exit 1
          fi
