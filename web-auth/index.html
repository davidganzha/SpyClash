    <title>SpyClash - Social Deduction Game</title>
    <script>
      // The Base44 web SDK enables product analytics by default. Disable that
      // module before Vite loads the application bundle, and remove any
      // identifier created by an older SpyClash website build.
      (function disableBase44Analytics() {
        if (window.location.pathname === "/MobileAuthCallback.html" || window.location.pathname === "/MobileAppleAuthCallback.html") return;
        try {
          localStorage.removeItem('base44_analytics_session_id');
        } catch (_) {
          // Storage can be unavailable in private browsing; analytics remains
          // disabled through the one-time SDK bootstrap parameter below.
        }

        const url = new URL(window.location.href);
        url.searchParams.set('analytics-enable', 'false');
        window.history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`);
      })();
    </script>
    <style>
      html, body { background: #000 !important; margin: 0; }
      #root { background: #000; min-height: 100vh; }
    </style>
  </head>
  <body style="background:#000;">
    <div id="root" style="background:#000;min-height:100vh;"></div>
    <script>
      // Force-unregister ALL service workers and clear ALL caches
      if (window.location.pathname !== '/MobileAuthCallback.html' && window.location.pathname !== '/MobileAppleAuthCallback.html' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
        });
      }
      if (window.location.pathname !== '/MobileAuthCallback.html' && window.location.pathname !== '/MobileAppleAuthCallback.html' && 'caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
