name: SpyClashGameCoreLab
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 168
    MARKETING_VERSION: '0.1'
    CODE_SIGN_STYLE: Automatic
targets:
  SpyClashGameCoreLab:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Configuration/BackendAllowlist.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.gamecore.lab
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Game Core Lab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the isolated game test controller on this Mac.
    info:
      path: Configuration/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  SpyClashGameCoreLab:
    build:
      targets:
        SpyClashGameCoreLab: all
    run:
      config: Debug
