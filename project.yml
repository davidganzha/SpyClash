name: SpyClash
options:
  bundleIdPrefix: com.spyclash
  deploymentTarget:
    iOS: "17.0"
fileGroups:
  - StoreKit
settings:
  base:
    CURRENT_PROJECT_VERSION: 50
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: 16.1.1
targets:
  SpyClash:
    type: application
    platform: iOS
    entitlements:
      path: SpyClash/Resources/SpyClash.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: SpyClash
        excludes:
          # File-provider conflict copies must never become a second app type.
          - "Services/HapticManager [0-9]*.swift"
          - "SWIFTUI_MIGRATION.md"
      - path: LICENSES/Rajdhani-OFL-1.1.txt
        buildPhase: resources
      - path: LICENSES/SocketIO-MIT.txt
        buildPhase: resources
      - path: LICENSES/Starscream-Apache-2.0.txt
        buildPhase: resources
    info:
      path: SpyClash/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpyClash
        CFBundleLocalizations:
          - en
          - es
          - ru
          - ru-UA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCameraUsageDescription: "Scan room QR codes and stabilize nearby Radar positions. / Escanear QR y estabilizar posiciones del Radar. / Сканировать QR-коды и стабилизировать позиции на Радаре."
        NSLocalNetworkUsageDescription: "Find nearby SpyClash players and deliver room invitations while the app is open. / Buscar jugadores cercanos y enviar invitaciones. / Находить игроков рядом и отправлять приглашения, пока приложение открыто."
        NSNearbyInteractionUsageDescription: "Measure the distance to nearby SpyClash players so the radar can show precise proximity. / Medir la distancia a jugadores cercanos. / Измерять расстояние до игроков рядом для точного радара."
        NSBonjourServices:
          - _spyclash-radar._tcp
          - _spyclash-radar._udp
        UIAppFonts:
          - Rajdhani-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.spyclash.auth
            CFBundleURLSchemes:
              - spyclash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SpyClash App Store 2026-07-26
    dependencies:
      - package: SocketIO
      - target: SpyClashWidgets
        embed: true
  SpyClashWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpyClashWidgets
      - path: SpyClash/LiveActivityShared
    info:
      path: SpyClashWidgets/Info.plist
      properties:
        CFBundleDisplayName: SpyClash Live
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.widgets
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SpyClash Widgets App Store 2026-07-26
  SpyClashTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpyClashTests
    dependencies:
      - target: SpyClash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.tests
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
schemes:
  SpyClash:
    build:
      targets:
        SpyClash: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/SpyClash.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
      targets:
        - SpyClashTests
    archive:
      config: Release
    management:
      shared: true
