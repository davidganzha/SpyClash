name: SpyClash
options:
  bundleIdPrefix: com.spyclash
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
  SupabaseDebug: debug
  SupabaseRelease: release
  SupabasePublicRelease: release
settings:
  base:
    CURRENT_PROJECT_VERSION: 237
    MARKETING_VERSION: 1.0.4
    SWIFT_VERSION: 6.0
    SPYCLASH_ADS_ENABLED: "NO"
    SPYCLASH_REWARDED_AD_PROVIDER: "admob"
    SPYCLASH_UNITY_GAME_ID: "800429660"
    SPYCLASH_UNITY_REWARDED_AD_UNIT_ID: "BP_Rewarded_iOS"
    SPYCLASH_UNITY_TEST_MODE: "NO"
    SPYCLASH_INTEGRATED_TEST_ADS_ENABLED: "NO"
    SPYCLASH_OWNED_ADMOB_SIMULATOR_TEST_ENABLED: "NO"
    # The linked SDK validates its app ID at launch even with ads disabled.
    # Owned bootstrap ID is required even when Unity is the selected provider.
    # Server activation still gates actual generation rewards and quotas.
    SPYCLASH_ADMOB_APP_ID: "ca-app-pub-5081830513960558~9442838104"
    SPYCLASH_REWARDED_AD_UNIT_ID: ""
    SPYCLASH_UNITY_TEST_ADS_ENABLED: "NO"
    # Owned Unity project; only initialized by an explicit Debug preview.
    SPYCLASH_UNITY_TEST_GAME_ID: "800429660"
    SPYCLASH_UNITY_TEST_AD_UNIT_ID: "BP_Rewarded_iOS"
  configs:
    Release:
      SPYCLASH_ADS_ENABLED: "YES"
      SPYCLASH_REWARDED_AD_PROVIDER: "unity"
    SupabasePublicRelease:
      SPYCLASH_ADS_ENABLED: "YES"
      SPYCLASH_REWARDED_AD_PROVIDER: "unity"
    Debug:
      SPYCLASH_ADS_ENABLED: "YES"
      SPYCLASH_ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
      SPYCLASH_REWARDED_AD_UNIT_ID: "ca-app-pub-3940256099942544/1712485313"
    SupabaseDebug:
      SPYCLASH_ADS_ENABLED: "YES"
      SPYCLASH_ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
      SPYCLASH_REWARDED_AD_UNIT_ID: "ca-app-pub-3940256099942544/1712485313"
packages:
  UnityAds:
    url: https://github.com/Unity-Technologies/Unity-Ads-Swift-Package.git
    exactVersion: 4.21.0
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: 16.1.1
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.12.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  SpyClash:
    type: application
    platform: iOS
    entitlements:
      path: SpyClash/Resources/SpyClash.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.game-center: true
    sources:
      - path: SpyClash
        excludes:
          # File-provider conflict copies must never become a second app type.
          - "Services/HapticManager [0-9]*.swift"
          - "SWIFTUI_MIGRATION.md"
      - path: experiments/supabase-game-core/ios/Sources/JSONValue.swift
      - path: experiments/supabase-game-core/ios/Sources/LabConfiguration.swift
      - path: experiments/supabase-game-core/ios/Sources/BackendClient.swift
      - path: experiments/supabase-game-core/ios/Sources/LabStore.swift
      - path: experiments/supabase-game-core/ios/Configuration/BackendAllowlist.json
        buildPhase: resources
      - path: release/SupabaseMainCandidateConfiguration.json
        buildPhase: resources
      - path: release/SupabasePublicConfiguration.json
        buildPhase: resources
      - path: LICENSES/Rajdhani-OFL-1.1.txt
        buildPhase: resources
      - path: LICENSES/SocketIO-MIT.txt
        buildPhase: resources
      - path: LICENSES/Starscream-Apache-2.0.txt
        buildPhase: resources
    info:
      path: SpyClash/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpyClash
        SpyClashBackendMode: "$(SPYCLASH_BACKEND_MODE)"
        GADApplicationIdentifier: "$(SPYCLASH_ADMOB_APP_ID)"
        GADDelayAppMeasurementInit: true
        SpyClashAdsEnabled: "$(SPYCLASH_ADS_ENABLED)"
        SpyClashRewardedAdProvider: "$(SPYCLASH_REWARDED_AD_PROVIDER)"
        SpyClashUnityGameID: "$(SPYCLASH_UNITY_GAME_ID)"
        SpyClashUnityRewardedAdUnitID: "$(SPYCLASH_UNITY_REWARDED_AD_UNIT_ID)"
        SpyClashUnityTestMode: "$(SPYCLASH_UNITY_TEST_MODE)"
        SpyClashIntegratedTestAdsEnabled: "$(SPYCLASH_INTEGRATED_TEST_ADS_ENABLED)"
        SpyClashOwnedAdMobSimulatorTestEnabled: "$(SPYCLASH_OWNED_ADMOB_SIMULATOR_TEST_ENABLED)"
        SpyClashRewardedAdUnitID: "$(SPYCLASH_REWARDED_AD_UNIT_ID)"
        SpyClashUnityTestAdsEnabled: "$(SPYCLASH_UNITY_TEST_ADS_ENABLED)"
