name: SpyClash
options:
  bundleIdPrefix: com.spyclash
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
  SupabaseDebug: debug
  SupabaseRelease: release
  SupabasePublicRelease: release
settings:
  base:
    CURRENT_PROJECT_VERSION: 198
    MARKETING_VERSION: 1.0.3
    SWIFT_VERSION: 6.0
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: 16.1.1
targets:
  SpyClash:
    type: application
    platform: iOS
    entitlements:
      path: SpyClash/Resources/SpyClash.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: SpyClash
        excludes:
          # File-provider conflict copies must never become a second app type.
          - "Services/HapticManager [0-9]*.swift"
          - "SWIFTUI_MIGRATION.md"
      - path: experiments/supabase-game-core/ios/Sources/JSONValue.swift
      - path: experiments/supabase-game-core/ios/Sources/LabConfiguration.swift
      - path: experiments/supabase-game-core/ios/Sources/BackendClient.swift
      - path: experiments/supabase-game-core/ios/Sources/LabStore.swift
      - path: experiments/supabase-game-core/ios/Configuration/BackendAllowlist.json
        buildPhase: resources
      - path: release/SupabaseMainCandidateConfiguration.json
        buildPhase: resources
      - path: release/SupabasePublicConfiguration.json
        buildPhase: resources
      - path: LICENSES/Rajdhani-OFL-1.1.txt
        buildPhase: resources
      - path: LICENSES/SocketIO-MIT.txt
        buildPhase: resources
      - path: LICENSES/Starscream-Apache-2.0.txt
        buildPhase: resources
    info:
      path: SpyClash/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpyClash
        SpyClashBackendMode: "$(SPYCLASH_BACKEND_MODE)"
        CFBundleLocalizations:
          - en
          - es
          - ru
          - ru-UA
          - uk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCameraUsageDescription: "Scan room QR codes and stabilize nearby Radar positions. / Escanear QR y estabilizar posiciones del Radar. / Сканировать QR-коды и стабилизировать позиции на Радаре. / Сканувати QR-коди й стабілізувати позиції гравців на Радарі."
        NSLocalNetworkUsageDescription: "Find nearby SpyClash players and deliver room invitations while the app is open. / Buscar jugadores cercanos y enviar invitaciones. / Находить игроков рядом и отправлять приглашения, пока приложение открыто. / Знаходити гравців поблизу й надсилати запрошення, поки застосунок відкритий."
        NSNearbyInteractionUsageDescription: "Measure the distance to nearby SpyClash players so the radar can show precise proximity. / Medir la distancia a jugadores cercanos. / Измерять расстояние до игроков рядом для точного радара. / Вимірювати відстань до гравців поблизу для точного Радара."
        NSBonjourServices:
          - _spyclash-radar._tcp
          - _spyclash-radar._udp
          - _spy-bbkfsg._tcp
          - _spy-bbkfsg._udp
        UIAppFonts:
          - Rajdhani-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.spyclash.auth
            CFBundleURLSchemes:
              - spyclash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios
        SPYCLASH_BACKEND_MODE: base44
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        SupabaseDebug:
          APS_ENVIRONMENT: development
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) SupabasePublicConfiguration.json"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG SPYCLASH_SUPABASE SPYCLASH_SUPABASE_MAIN_CANDIDATE"
          SPYCLASH_BACKEND_MODE: supabase-main-candidate
        SupabaseRelease:
          APS_ENVIRONMENT: production
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) SupabasePublicConfiguration.json"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPYCLASH_SUPABASE SPYCLASH_SUPABASE_MAIN_CANDIDATE"
          SPYCLASH_BACKEND_MODE: supabase-main-candidate
        SupabasePublicRelease:
          APS_ENVIRONMENT: production
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPYCLASH_SUPABASE SPYCLASH_SUPABASE_PUBLIC"
          SPYCLASH_BACKEND_MODE: supabase-public
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) SupabaseMainCandidateConfiguration.json BackendAllowlist.json"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SpyClash App Store 2026-07-26
        Debug:
          APS_ENVIRONMENT: development
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) SupabaseMainCandidateConfiguration.json SupabasePublicConfiguration.json BackendAllowlist.json"
        Release:
          APS_ENVIRONMENT: production
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) SupabaseMainCandidateConfiguration.json SupabasePublicConfiguration.json BackendAllowlist.json"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SpyClash App Store 2026-07-26
    dependencies:
      - package: SocketIO
      - target: SpyClashWidgets
        embed: true
  SpyClashSupabaseTest:
    type: application
    platform: iOS
    sources:
      - path: SpyClash
        excludes:
          - "Services/HapticManager [0-9]*.swift"
          - "SWIFTUI_MIGRATION.md"
          - "Resources/Info.plist"
          - "Resources/SpyClash.entitlements"
          - "Resources/*.lproj/InfoPlist.strings"
      - path: experiments/supabase-game-core/ios/Sources/JSONValue.swift
      - path: experiments/supabase-game-core/ios/Sources/LabConfiguration.swift
      - path: experiments/supabase-game-core/ios/Sources/BackendClient.swift
      - path: experiments/supabase-game-core/ios/Sources/LabStore.swift
      - path: experiments/supabase-game-core/ios/Configuration/BackendAllowlist.json
        buildPhase: resources
    info:
      path: SpyClashSupabaseTests/Support/TestApp-Info.plist
      properties:
        CFBundleDisplayName: SpyClash TEST
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts:
          - Rajdhani-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Scan a test room QR code.
        NSNearbyInteractionUsageDescription: Measure the distance to nearby SpyClash players so the radar can show precise proximity.
        CFBundleURLTypes:
          - CFBundleURLName: com.spyclash.supabasetest
            CFBundleURLSchemes:
              - spyclash-supabasetest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.supabasetest
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPYCLASH_SUPABASE_TEST"
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: SocketIO
  SpyClashSupabaseStaging:
    type: application
    platform: iOS
    entitlements:
      path: SpyClashSupabaseStagingTests/Support/Staging.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: SpyClash
        excludes:
          - "Services/HapticManager [0-9]*.swift"
          - "SWIFTUI_MIGRATION.md"
          - "Resources/Info.plist"
          - "Resources/SpyClash.entitlements"
          - "Resources/*.lproj/InfoPlist.strings"
      - path: experiments/supabase-game-core/ios/Sources/JSONValue.swift
      - path: experiments/supabase-game-core/ios/Sources/LabConfiguration.swift
      - path: experiments/supabase-game-core/ios/Sources/BackendClient.swift
      - path: experiments/supabase-game-core/ios/Sources/LabStore.swift
      - path: experiments/supabase-game-core/ios/Configuration/BackendAllowlist.json
        buildPhase: resources
      - path: SpyClashSupabaseStagingTests/Support/SupabaseAppConfiguration.json
        buildPhase: resources
    info:
      path: SpyClashSupabaseStagingTests/Support/StagingApp-Info.plist
      properties:
        CFBundleDisplayName: SpyClash TEST
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocalNetworkUsageDescription: Find nearby SpyClash players and deliver room invitations.
        NSBonjourServices:
          - _spyclash-radar._tcp
          - _spyclash-radar._udp
          - _spy-bbkfsg._tcp
          - _spy-bbkfsg._udp
        UIAppFonts:
          - Rajdhani-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Scan a test room QR code.
        NSNearbyInteractionUsageDescription: Measure the distance to nearby SpyClash players so the radar can show precise proximity.
        CFBundleURLTypes:
          - CFBundleURLName: com.spyclash.supabasetest
            CFBundleURLSchemes:
              - spyclash-supabasetest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.supabasetest
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPYCLASH_SUPABASE"
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - package: SocketIO
      - target: SpyClashSupabaseStagingWidgets
        embed: true
  SpyClashSupabaseStagingWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpyClashWidgets
        excludes:
          - Info.plist
      - path: SpyClash/LiveActivityShared
    info:
      path: SpyClashSupabaseStagingTests/Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: SpyClash Live
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.supabasetest.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPYCLASH_SUPABASE"
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: 1
  SpyClashSupabaseStagingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpyClashSupabaseStagingTests
        excludes:
          - Support
      - path: SpyClashTests/CommunityResponsivenessTests.swift
    dependencies:
      - target: SpyClashSupabaseStaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.supabasetest.stagingtests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPYCLASH_SUPABASE_STAGING_TESTS"
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 1
  SpyClashSupabaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpyClashSupabaseTests
        excludes:
          - Support
    dependencies:
      - target: SpyClashSupabaseTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.supabasetest.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 1
  SpyClashWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpyClashWidgets
      - path: SpyClash/LiveActivityShared
    info:
      path: SpyClashWidgets/Info.plist
      properties:
        CFBundleDisplayName: SpyClash Live
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.widgets
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: 1
      configs:
        SupabasePublicRelease:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SpyClash Widgets App Store 2026-07-26
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SpyClash Widgets App Store 2026-07-26
  SpyClashTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpyClashTests
        excludes:
          - SupabasePublicReleaseTests.swift
    dependencies:
      - target: SpyClash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.tests
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
  SpyClashPublicReleaseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpyClashTests/SupabasePublicReleaseTests.swift
    dependencies:
      - target: SpyClash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.publicreleasetests
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
      configs:
        SupabasePublicRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPYCLASH_SUPABASE_PUBLIC"
  SpyClashSettingsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpyClashSettingsUITests
    dependencies:
      - target: SpyClash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.ios.settings-uitests
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 3Z64QKNL54
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
schemes:
  SpyClash-Supabase-Public:
    build:
      targets:
        SpyClash: all
    run:
      config: SupabasePublicRelease
    analyze:
      config: SupabasePublicRelease
    profile:
      config: SupabasePublicRelease
    test:
      config: SupabasePublicRelease
      environmentVariables:
        LAB_CONFIG_PATH: /dev/null
      targets:
        - SpyClashPublicReleaseTests
    archive:
      config: SupabasePublicRelease
    management:
      shared: true
  SpyClash-Supabase-Main-Candidate:
    build:
      targets:
        SpyClash: all
    run:
      config: SupabaseDebug
    analyze:
      config: SupabaseDebug
    archive:
      config: SupabaseRelease
    management:
      shared: true
  SpyClash-Supabase-Staging:
    build:
      targets:
        SpyClashSupabaseStaging: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpyClashSupabaseStagingTests
    archive:
      config: Release
  SpyClash-Supabase-Test:
    build:
      targets:
        SpyClashSupabaseTest: all
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        # Unit tests use injected transports, never a Simulator's saved lab account.
        LAB_CONFIG_PATH: /dev/null
      targets:
        - SpyClashSupabaseTests
    management:
      shared: true
  SpyClash-Settings-UI:
    build:
      targets:
        SpyClash: all
    test:
      config: Debug
      targets:
        - SpyClashSettingsUITests
    management:
      shared: true
  SpyClash:
    build:
      targets:
        SpyClash: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
      targets:
        - SpyClashTests
    archive:
      config: Release
    management:
      shared: true
