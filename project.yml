name: SpyClash
options:
  bundleIdPrefix: com.spyclash
  deploymentTarget:
    iOS: "17.0"
fileGroups:
  - StoreKit
settings:
  base:
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: 16.1.1
targets:
  SpyClash:
    type: application
    platform: iOS
    entitlements:
      path: SpyClash/Resources/SpyClash.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: SpyClash
        excludes:
          # File-provider conflict copies must never become a second app type.
          - "Services/HapticManager [0-9]*.swift"
          # The iOS product intentionally ships without bundled audio.
          - "Resources/Sounds"
          - "SWIFTUI_MIGRATION.md"
      - path: LICENSES/Rajdhani-OFL-1.1.txt
        buildPhase: resources
      - path: LICENSES/SocketIO-MIT.txt
        buildPhase: resources
      - path: LICENSES/Starscream-Apache-2.0.txt
        buildPhase: resources
    info:
      path: SpyClash/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpyClash
        CFBundleLocalizations:
          - en
          - es
          - ru
          - ru-UA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCameraUsageDescription: "Scan SpyClash room QR codes. / Escanear QR de salas SpyClash. / Сканировать QR-коды комнат SpyClash."
        UIAppFonts:
          - Rajdhani-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.spyclash.auth
            CFBundleURLSchemes:
              - spyclash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.app
        DEVELOPMENT_TEAM: S24F9M5CG7
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - package: SocketIO
      - target: SpyClashWidgets
        embed: true
  SpyClashWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpyClashWidgets
      - path: SpyClash/LiveActivityShared
    info:
      path: SpyClashWidgets/Info.plist
      properties:
        CFBundleDisplayName: SpyClash Live
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyclash.app.widgets
        DEVELOPMENT_TEAM: S24F9M5CG7
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: 1
schemes:
  SpyClash:
    build:
      targets:
        SpyClash: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/SpyClash.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
